<title>港湾快递 · 小镇委托</title>
<style>
:root {
  --ink:#173d46; --deep:#10343d; --teal:#256977; --sea:#a9ddd3;
  --brass:#e7ba6b; --paper:#fff4d6; --edge:#456566;
  font:14px/1.45 "Cascadia Mono",Consolas,"Microsoft YaHei",monospace;
  color:var(--ink);
}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(135deg,#16383f 0 3px,#183d43 3px 7px)}
[hidden]{display:none!important}
#stage{width:min(1100px,calc(100% - 28px));height:min(800px,calc(100% - 28px));position:relative;isolation:isolate;overflow:hidden;border:3px solid var(--deep);outline:1px solid #9baf96;box-shadow:0 6px 0 #0a242b,0 10px 34px #091d2466;background-color:#f5f7ec;background-image:linear-gradient(#899e9712 1px,transparent 1px),linear-gradient(90deg,#899e9712 1px,transparent 1px);background-size:24px 24px}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px #355d5555}
#c{display:block;position:absolute;left:50%;top:50%;image-rendering:pixelated;touch-action:none;outline:none;cursor:crosshair;mix-blend-mode:multiply}
#stage.indoors{background:#26383d radial-gradient(ellipse at 50% 53%,#465859 0%,#304449 50%,#23353b 100%)}
#stage.indoors #c{mix-blend-mode:normal}
#vehicleSpeed{position:absolute;top:0;left:0;width:54px;height:18px;pointer-events:none;user-select:none;display:flex;align-items:baseline;justify-content:center;gap:3px;background:var(--deep);color:var(--paper);border:1px solid #95c6b9;box-shadow:1px 1px 0 #16383f88;font:bold 13px/16px Consolas,monospace;font-variant-numeric:tabular-nums}
#vehicleSpeed small{font-size:9px;color:#b6dfd4}
button{font:inherit;cursor:pointer;color:var(--ink);font-weight:bold;border:2px solid var(--deep);border-radius:2px;background:var(--paper);padding:7px 12px;box-shadow:inset 0 2px 0 #fffff3,inset 0 -2px 0 #d8c6a1,0 3px 0 var(--deep)}
button:hover{filter:brightness(1.06)} button:active{transform:translateY(2px);box-shadow:none}button:focus-visible,a:focus-visible{outline:3px solid #e88237;outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
#hud{pointer-events:none;position:absolute;left:14px;top:14px;display:flex;max-width:calc(100% - 84px);background:var(--deep);color:var(--paper);border:2px solid var(--deep);box-shadow:2px 3px 0 #173d466a}
.pennant{flex:none;width:8px;background:repeating-linear-gradient(150deg,#e46e4c 0 9px,#fff1c7 9px 18px,#2d8390 18px 27px,#fff1c7 27px 36px)}
.ticket{min-width:0;padding:7px 13px 8px}.masthead{font-weight:900;font-size:15px;letter-spacing:.09em}.masthead i,.folio{font:700 10px/1 monospace;letter-spacing:.16em;color:var(--brass)}
#hud small{font-size:11px;color:#a9dace}#objective,#job{font-size:13px;font-weight:600}#manifest{color:#ffe2a1;font-variant-numeric:tabular-nums}
#energy{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
.game-byline{color:#ffe1a8;font-size:12px;line-height:1.35;margin:1px 0 3px}
#languageToggle{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 52px);min-width:44px;min-height:44px;padding:4px 7px;background:var(--paper);color:var(--ink)}
html[lang="en"] #deck .bar{flex-wrap:wrap}html[lang="en"] #motion,html[lang="en"] #tools{max-width:100%}
.menu-toggle{position:absolute;right:14px;top:14px;width:42px;height:39px;padding:0;color:var(--paper);background:var(--teal);box-shadow:inset 0 2px #45909a,0 3px var(--deep);font-size:20px}
#deck{position:absolute;bottom:14px;left:14px;right:14px;pointer-events:none;display:grid;gap:8px}
#status{width:fit-content;max-width:min(100%,490px);padding:4px 9px;border-left:4px solid var(--brass);background:#163b42ed;color:#fff6d9;font-size:12px}
.bar{display:flex;justify-content:space-between;align-items:end;gap:8px}.bar button{pointer-events:auto}
#tools,#motion{display:flex;flex-wrap:wrap;gap:5px}#tools{margin-left:auto;justify-content:end}
#act,#shift,#run[aria-pressed=true]{background:var(--teal);color:var(--paper);box-shadow:inset 0 2px #47919a,0 3px var(--deep)}
#findBoat{background:#c2e4dc}
#stage dialog{max-width:calc(100% - 24px);width:352px;max-height:82dvh;overflow:auto;border:3px solid var(--deep);border-top:7px solid var(--teal);border-radius:1px;padding:17px 19px;background:var(--paper);color:var(--ink);font:inherit;box-shadow:4px 5px 0 #123a42aa}
#stage dialog::backdrop{background:#102e39a1}#stage dialog h2{font-size:20px;font-weight:800;margin:3px 0 8px}#stage dialog p{margin:4px 0 12px}.folio{color:#35717b}
#entries,.settings-grid,#portExtras{display:grid;gap:8px;margin:12px 0}#entries button{text-align:left}
#openOddities{width:100%;text-align:left;background:#f5d694}
#oddityToast{position:absolute;top:0;left:0;z-index:2;pointer-events:none;display:grid;grid-template-columns:26px 1fr;align-items:center;column-gap:7px;width:max-content;max-width:calc(100% - 8px);padding:4px 9px 5px 6px;background:#fff0c5;color:var(--ink);border:2px solid var(--deep);box-shadow:2px 2px 0 #173d4655;line-height:1.15}
#oddityToast small{color:#855119;font-size:10px;letter-spacing:.12em}
#speechBubble{position:absolute;top:0;left:0;z-index:2;pointer-events:none;user-select:none;display:flex;gap:2px;padding:2px 4px;background:#fffcdf;border:2px solid #21484b;box-shadow:2px 2px 0 #12383b66}
#speechBubble canvas{display:block;width:24px;height:24px;image-rendering:pixelated}
#speechBubble::after{content:"";position:absolute;left:calc(var(--tip) - 4px);top:100%;width:8px;height:2px;background:#fffcdf;box-shadow:0 2px #21484b,0 4px 0 -1px #21484b}
#oddityToast b{font-size:14px}
.toastBadge{grid-row:span 2;display:grid;place-items:center;height:26px;border:3px double #a64828;color:#963a22;background:#ffdf98;font-weight:800;transform:rotate(-6deg)}
@media(prefers-reduced-motion:no-preference){.toastBadge{animation:stampIn .22s ease-out}@keyframes stampIn{from{transform:translateY(-5px) rotate(-13deg) scale(1.24)}to{transform:rotate(-6deg)}}}
#stage #oddities{width:400px;padding-top:0}
.oddityHead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);border-bottom:2px solid var(--ink);padding:10px 0 5px}
#oddityList{padding:0;margin:8px 0 0;list-style:none}
#oddityList li{display:grid;grid-template-columns:31px 1fr;column-gap:10px;padding:8px 0;border-top:1px dashed #bdad87;align-items:center}
.odditySeal{grid-row:span 2;display:grid;place-items:center;width:30px;height:30px;border:1px dashed #ad997b;color:#776c5e;font:bold 17px/1 monospace}
.collected .odditySeal{color:#aa452d;border:3px double currentColor;transform:rotate(-6deg);background:#ffe7bf}
#oddityList b{font-size:13px}#oddityList small{color:#526362;font-size:12px}
.settings-grid{grid-template-columns:1fr 1fr}
#settings #pp-menu,#settings #pp-rules-open,#settings #pp-credits{position:static;transform:none}
#settings .pp-link,#stage #pp-rules .pp-link{font:inherit;color:var(--ink);background:#f1e5c7;border:1px solid #8d997e;margin:0;padding:8px;box-shadow:none}
#settings #pp-menu>button{width:100%}#settings #pp-credits{display:flex;flex-wrap:wrap;gap:0 12px;font-size:10px;color:var(--edge)}
@media(max-width:650px),(max-height:520px){
  #stage{width:100%;height:100%;border-width:2px}
  #hud{left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top))}
  .menu-toggle{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
  #deck{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom))}
  .ticket{padding:5px 9px}.bar button{font-size:12px;padding:7px 9px;min-height:36px}#status{font-size:11px}
}
@media(pointer:coarse){
  .bar button,.menu-toggle,#stage dialog button{min-width:44px;min-height:44px}
  #motion{flex-shrink:0}
}

</style>
</head>
<body>
<main id="stage" aria-label="港湾快递游戏画面">
  <canvas id="c" tabindex="0" aria-label="港湾快递。方向键或 WASD 移动，点地图前往，E 互动。"></canvas>
  <div id="vehicleSpeed" hidden><b>0</b><small>km/h</small></div>
  <header id="hud"><div class="pennant" aria-hidden="true"></div><div class="ticket">
    <div class="masthead">港湾快递 <i>HARBOR POST</i></div>
    <div class="game-byline" lang="zh-CN" translate="no">codex 和 猫大爷</div>
    <div id="walkHud"><small id="stamps"></small><div id="objective"></div><progress id="energy" aria-label="角色体力" max="100" value="100" hidden></progress></div>
    <div id="boatHud" hidden><small id="voyageTitle">海上航行</small>
      <div id="manifest" hidden><b id="score">0</b> / 5 单　<b id="time">60</b> 秒</div><div id="job"></div></div>
  </div></header>
  <div id="oddityToast" role="status" aria-atomic="true" hidden></div>
  <div id="speechBubble" role="img" hidden></div>
  <button id="portMenu" class="menu-toggle" aria-label="航务菜单" title="航务菜单">☰</button>
  <button id="languageToggle" type="button" aria-label="Switch to English" lang="en" translate="no">EN</button>
  <footer id="deck"><div id="status" role="status" aria-live="polite"></div>
    <div class="bar"><div id="motion"><button id="leap">跳跃</button><button id="brake" hidden>刹车</button><button id="run" aria-pressed="false">加速</button></div>
    <div id="tools"><button id="findBoat">找船</button><button id="journal">委托簿</button><button id="shift" hidden>接海运单</button><button id="act">交谈</button></div></div>
  </footer>
  <dialog id="ledger" aria-labelledby="ledgerTitle"><small class="folio">HARBOR POST / 01</small><h2 id="ledgerTitle">小镇委托簿</h2><p>选一个地点，沿街走过去。</p><div id="entries"></div><button id="closeLedger">合上</button></dialog>
  <dialog id="settings" aria-labelledby="settingsTitle"><small class="folio">HARBOR POST / 02</small><h2 id="settingsTitle">航务菜单</h2>
    <p><b>《港湾快递》共同制作 · codex 和 猫大爷</b></p>
    <div class="settings-grid"><button id="camera">看全图</button><button id="mute" aria-pressed="false">声音开</button></div>
    <button id="openOddities">港湾怪事簿 · 成就</button>
    <div id="portExtras"></div><button id="closeSettings">返回游戏</button></dialog>
  <dialog id="oddities" aria-labelledby="oddityTitle"><div class="oddityHead"><div><small class="folio">HARBOR POST / 03</small><h2 id="oddityTitle">港湾怪事簿</h2></div><button id="closeOddities" aria-label="合上怪事簿">合上</button></div>
    <p id="oddityCount"></p><ol id="oddityList"></ol></dialog>
</main>
<script>
'use strict';
// Shared chrome for every game: game menu (top centre) and rules popup (top right).
window.PixelPlays = (() => {
  // add a game here and give it a folder; `soon` entries show in the menu but do not link
  const GAMES = [
    { id: 'balote', title: 'Balote' },
    { id: 'stari-most', title: 'Stari Most' },
    { id: 'laundry', title: 'Rooftop Laundry' },
    { id: 'tie-break', title: 'Tie-Break' },
    { id: 'mini-ramp', title: 'Mini Ramp' },
    { id: 'river-bend', title: 'River Bend' },
    { id: 'hairpin', title: 'Hairpin' },
    { id: 'number-run', title: 'Number Run' },
    { id: 'harbor-courier', title: 'Harbor Courier' },
  ];
  const MUSIC_VOLUME = .4;
  const CREDITS = [
    ['Concept by', 'abhi', 'https://x.com/awwbhi2'],
    ['Game by', 'AmirMushich', 'https://x.com/AmirMushich'],
  ];
  const css = `
    .pp-link { font: inherit; color: #8b877f; background: none; border: 0; padding: 10px; margin: 0; cursor: pointer; }
    .pp-link:hover, .pp-link:focus-visible, .pp-link[aria-expanded="true"] { color: #1c1b19; }
    #pp-menu { position: fixed; top: max(4px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 5; text-align: center; }
    #pp-list { list-style: none; margin: 0; padding: 4px 0; background: #fff; border: 1px solid #1c1b19; min-width: 150px; text-align: left; }
    #pp-list[hidden] { display: none; }
    #pp-list a, #pp-list span { display: flex; justify-content: space-between; gap: 16px; padding: 8px 12px; color: #1c1b19; text-decoration: none; }
    #pp-list a:hover, #pp-list a:focus-visible { background: #1c1b19; color: #fff; outline: none; }
    #pp-list a[aria-current="page"]::after { content: "•"; }
    #pp-list span { color: #b3afa7; }
    #pp-rules-open { position: fixed; top: max(4px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); z-index: 5; }
    #pp-rules { width: min(340px, calc(100vw - 32px)); padding: 16px; border: 1px solid #1c1b19; color: #1c1b19; background: #fff; font: inherit; }
    #pp-rules::backdrop { background: rgba(255, 255, 255, .72); }
    #pp-rules h2 { margin: 0 0 10px; font: inherit; font-weight: 600; }
    #pp-rules ol { margin: 0 0 8px; padding-left: 18px; }
    #pp-rules li { margin-bottom: 8px; }
    #pp-rules form { text-align: right; }
    #pp-rules .pp-link { margin: 0 -10px -10px; color: #1c1b19; }
    #pp-credits { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 4; display: flex; gap: 16px; color: #8b877f; white-space: nowrap; pointer-events: none; }
    #pp-credits a { color: inherit; text-decoration: underline; text-underline-offset: 2px; pointer-events: auto; }
    #pp-credits a:hover, #pp-credits a:focus-visible { color: #1c1b19; }
    /* long end-of-game status lines run towards the centre, so the credits step above them */
    @media (max-width: 1200px) { #pp-credits { bottom: max(38px, calc(env(safe-area-inset-bottom) + 24px)); } }
    @media (max-width: 600px) { #pp-credits { bottom: max(72px, calc(env(safe-area-inset-bottom) + 58px)); } }
  `;
  function mount({ id, rules, music = true }) {
    const game = GAMES.find(g => g.id === id);
    const style = document.createElement('style');
    style.textContent = css;
    document.head.append(style);

    const menu = document.createElement('nav');
    menu.id = 'pp-menu';
    menu.setAttribute('aria-label', 'Games');
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'pp-link';
    toggle.textContent = game.title + ' ▾';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-controls', 'pp-list');
    const list = document.createElement('ul');
    list.id = 'pp-list';
    list.hidden = true;
    for (const g of GAMES) {
      const item = document.createElement('li');
      if (g.soon) {
        const label = document.createElement('span');
        label.innerHTML = '<span style="padding:0">' + g.title + '</span><span style="padding:0">soon</span>';
        item.append(label);
      } else {
        const link = document.createElement('a');
        link.href = '../' + g.id + '/';
        link.textContent = g.title;
        if (g.id === id) link.setAttribute('aria-current', 'page');
        item.append(link);
      }
      list.append(item);
    }
    menu.append(toggle, list);
    const setOpen = open => {
      list.hidden = !open;
      toggle.setAttribute('aria-expanded', String(open));
    };
    toggle.addEventListener('click', () => setOpen(list.hidden));
    document.addEventListener('pointerdown', e => { if (!menu.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !list.hidden) { setOpen(false); toggle.focus(); }
    });

    const open = document.createElement('button');
    open.type = 'button';
    open.id = 'pp-rules-open';
    open.className = 'pp-link';
    open.textContent = 'Rules';
    const dialog = document.createElement('dialog');
    dialog.id = 'pp-rules';
    dialog.setAttribute('aria-labelledby', 'pp-rules-title');
    const title = document.createElement('h2');
    title.id = 'pp-rules-title';
    title.textContent = game.title;
    const steps = document.createElement('ol');
    for (const rule of rules) {
      const li = document.createElement('li');
      li.textContent = rule;
      steps.append(li);
    }
    const form = document.createElement('form');
    form.method = 'dialog';
    form.innerHTML = '<button class="pp-link">Close</button>';
    dialog.append(title, steps, form);
    open.addEventListener('click', () => dialog.showModal());
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

    const credits = document.createElement('div');
    credits.id = 'pp-credits';
    for (const [label, name, url] of CREDITS) {
      const line = document.createElement('span');
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = name;
      line.append(label + ' ', link);
      credits.append(line);
    }

    document.body.append(menu, open, dialog, credits);
    if (music) startMusic(id);
  }
  // each game loops <id>/<id>.mp3 from the first gesture, because browsers block sound before one.
  // The game's own sound button mutes it too.
  function startMusic(id) {
    const music = new Audio(id + '.mp3');
    music.loop = true;
    music.volume = MUSIC_VOLUME;
    music.preload = 'none';
    let started = false;
    const start = () => {
      started = true;
      music.play().catch(() => { started = false; });
    };
    for (const kind of ['pointerdown', 'keydown']) document.addEventListener(kind, () => { if (!started) start(); });
    document.getElementById('mute').addEventListener('click', () => { music.muted = !music.muted; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) music.pause();
      else if (started) start();
    });
    PixelPlays.music = music;
  }
  return { mount, GAMES };
})();

</script>
<script>
PixelPlays.mount({
  id:'harbor-courier', music:false,
  rules:[
    '绿色倒三角下是你。按方向键或 WASD 自由走动，点地面或黄色感叹号可沿脚印前往目的地。',
    '薄荷绿货车停在店铺侧的白线车位。走近按 E 上车，左右键沿街行驶，上下键换道，空格刹车。驶近 P 车位按 E 泊车下车，离得远时会标出最近车位。',
    '空格跳跃，按住 Shift 可加速跑步或游泳。角色旁的体力条在恢复时变为半透明，回满后消失。触屏可点「跳跃」或「加速」。沿海滨街向地图外走，或游出下方浮标，可从另一端回来。',
    '整段海滨路都能穿过。被车碰到会弹开两步，落地后可以继续走。走向海水即可下水，游向沙滩、栈桥或防波堤即可上岸。也可直接点要去的水面或岸面。',
    '走近后按 E 或点互动按钮，接下和完成居民委托，收集四枚港口邮戳。岸上不计时。',
    '海滨路上可以进咖啡馆、渔网工坊、藤院花房和海岬瞭望室。点建筑的门或从委托簿选地点，走近按 E 进屋。在室内可点地板或用方向键走动，靠近物件互动，走到青绿色门垫按 E 出门。',
    '点「找船」或蓝顶船上的锚标，小人会走到栈桥。按 E 登船即可自由航行；靠近码头按 E 上岸，船会停在当地。鱼市泊位可以接限时海运单。',
    '驾驶蓝顶艇时用方向键或 WASD 掌舵，也可以点水面。车船都能按 Shift 加速，按空格减速滑停。触屏点「刹车」或「减速」也能停稳。',
    '首单从鱼市取鲜鱼，绕过红灯塔送到咖啡店。驶近黄色泊位后自动靠岸，等鱼箱放稳再开。蓝色泊位有人接货。',

  drawDots(ink, INK);

}
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const fitScale = Math.min(innerWidth / W, (innerHeight - 40) / H);
  const scale = Math.max(1, Math.floor(fitScale * dpr)) / dpr;

  canvas.style.height = H * scale + 'px';

<script>
// A numbered stamp is permanent. Mileage stops accumulating once its stamp is dry.
const oddities=(()=>{
  const catalog=[
    ['bumper','碰','保险杠握手','开小货车和另一辆车碰了个面。','鱼市货车有一套自己的打招呼方式。'],

    ['parcel','弹','原来快递是我','步行时被车弹开了一次。','站在路上的时候，你也可能是一件快递。'],
    ['run','跑','四十二米马拉松','在陆地上累计加速跑了 42 米。','本港马拉松按米算。',42,'米'],
    ['swim','泳','海水抄近道','在港湾里累计游了 15 米。','鞋子留给陆地，水路也算路。',15,'米'],

    ['noBoat','渡','省下一张船票','自己游出南航道，又从西湾游了回来。','红绿浮标以外，游泳也能搭上环线。'],
    ['loop','绕','怎么又是这条街','步行穿过街口，从另一头回到镇上。','沿着海滨路一直走，地图也有街对面。'],
    ['detour','鲜','鱼比收件人先看海','装着鱼箱穿过海口，绕外海回港。','鱼箱上船以后，送货员还可以绕点路。'],
    ['stamps','邮','全镇都欠我人情','集齐四位居民的委托邮戳。','翻翻委托簿，看看还有谁在等你。',4,'枚'],
    ['fish','班','五单，一身鱼味','在同一班海运里送完五单。','鱼市开班之后，得赶在收工前送完。'],
    ['bothSides','换','事故双方都是熟人','既当过碰到行人的司机，也当过被车弹开的行人。','同一条路上的小插曲，换个身份再看一次。'],
    ['chime','铛','人工报时器','在钟楼门口起跳了三次，铛、铛、铛。','走到钟楼门前，用脚给小镇报个时。',3,'次'],
    ['amphibian','蹼','跑鞋长出了蹼','刚在岸上跑起来，又冲进水里加速游了两米。','沿沙滩起跑，别在浪花前松开加速。']
  ];
  const entries=new Map(catalog.map(([id,seal,title,story,hint,goal=1,unit=''])=>[id,{seal,title,story,hint,goal,unit}]));
  const key='pixel-plays.harbor.oddities.v1',values={};
  try{
    const saved=JSON.parse(localStorage.getItem(key));
    for(const [id,{goal}] of entries){
      const n=saved?.[id];
      if(Number.isFinite(n)&&n>0)values[id]=Math.min(n,goal);
    }
  }catch{}
  let saveTimer=0,dirty=false;
  function save(){
    clearTimeout(saveTimer);saveTimer=0;
    if(!dirty)return;
    try{localStorage.setItem(key,JSON.stringify(values));dirty=false;}catch{}
  }
  addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  const queue=[],toast=document.getElementById('oddityToast');
  let remaining=0,lastShown=0;
  function placeToast(pin,width,height,gap,speechVisible){
    const now=performance.now();
    if(speechVisible||!pin||pin.x<0||pin.x>width||pin.y<0||pin.y>height||document.hidden||document.querySelector('dialog[open]')){
      toast.hidden=true;lastShown=0;return;
    }
    if(!remaining){
      const item=queue.shift();
      const badge=document.createElement('span'),label=document.createElement('small'),title=document.createElement('b');
      badge.className='toastBadge';badge.setAttribute('aria-hidden','true');badge.textContent=item.seal;
      label.textContent='成就解锁';title.textContent=item.title;
      toast.replaceChildren(badge,label,title);
      remaining=2900;
    }
    toast.hidden=false;
    const w=toast.offsetWidth,h=toast.offsetHeight;
    const left=clamp(Math.round(pin.x-w/2),4,Math.max(4,width-w-4));
    const top=Math.max(4,Math.round(pin.y-gap-h));
    toast.style.transform='translate('+left+'px,'+top+'px)';
    if(lastShown)remaining=Math.max(0,remaining-Math.min(now-lastShown,100));
    lastShown=now;
    if(!remaining){toast.hidden=true;lastShown=0;}
  }
  function set(id,total){
    const item=entries.get(id),previous=values[id]||0;
    const next=Math.min(item.goal,total);
    if(next<=previous)return;
    values[id]=next;dirty=true;
    if(next===item.goal){
      save();queue.push(item);
      if((id==='walker'||id==='parcel')&&values.walker&&values.parcel)set('bothSides',1);
    }else if(!saveTimer)saveTimer=setTimeout(save,2000);
  }
  function record(id,amount=1){set(id,(values[id]||0)+amount);}
  const book=document.getElementById('oddities'),list=document.getElementById('oddityList');
  function open(){
    const rows=[];let count=0;
    for(const [id,item] of entries){
      const value=values[id]||0,unlocked=value===item.goal;
      if(unlocked)count++;
      const row=document.createElement('li'),seal=document.createElement('span');
      const title=document.createElement('b'),note=document.createElement('small');
      row.classList.toggle('collected',unlocked);
      seal.className='odditySeal';seal.textContent=unlocked?item.seal:'·';
      title.textContent=unlocked?item.title:'待发现 · '+String(rows.length+1).padStart(2,'0');
      note.textContent=unlocked?item.story:item.hint+(item.unit?'　'+Math.floor(value)+' / '+item.goal+' '+item.unit:'');
      row.append(seal,title,note);rows.push(row);
    }
    list.replaceChildren(...rows);
    document.getElementById('oddityCount').textContent='已盖章 '+count+' / '+entries.size+'　·　小镇居民目击实录';
    settings.close();book.showModal();book.scrollTop=0;
  }
  document.getElementById('openOddities').onclick=open;
  document.getElementById('closeOddities').onclick=()=>book.close();
  book.addEventListener('close',()=>{settings.showModal();document.getElementById('openOddities').focus();});
  return {record,set,placeToast,get hasToast(){return remaining>0||queue.length>0;}};
})();

</script>

<script>
// Geometry is in metres on the isometric ground plane. Art, berths and
// navigation all use the same coastline and masonry footprint.
const harbor = (() => {
  const wall = { x: 4.1, root: -5.55, tip: 8.15, half: .88 };
  const bridgeSteps=Array.from({length:5},(_,i)=>({
    start:-6.55+i*.2,end:-6.55+(i+1)*.2,top:(i+1)*1.02/5
  }));
  const landHalf=24.45, seaFront=21.9;
  const westCove=x=>1.1+.112*(x+20)**2;
  const yardEdge=x=>-.7+.075*(x-20)**2;
  const reefs = [[11, 6.4, .95], [10.1, 7.8, .57], [8.7, 3.2, .72]];
  const shoreRocks=[];
  for(let i=0;i<42;i++){
    const x=9.98+3.3*hash(i,21),y=-4.5+9.9*hash(i,22);
    if(y<1.70+(x-9.9)*.88&&x<=13.15)shoreRocks.push([x,y,.32+.56*hash(i,23)]);
  }
  const piers = [
    { name: 'west beach', x: -8.65, y: 4.6, dx: 1, dy: 0, length: 4.05 },
    { name: 'market pier', x: -2.95, y: -5.45, dx: 0, dy: 1, length: 4.64, halfWidth:.93 },
    { name: 'cafe quay', x: 7.6, y: -5.45, dx: 0, dy: 1, length: 2.85 },
    { name: 'bathing cove', x: -20, y: westCove(-20)-.44, dx: 0, dy: 1, length: 3.5 },
    { name: 'boatyard', x: 20, y: yardEdge(20)-.45, dx: 0, dy: 1, length: 3.65 },
  ];
  const quay = -5.45;
  const marketDeck={x:.10,y:-4.84,w:2.12,d:1.10};
  // The timber deck meets the side of the higher breakwater. Join them
  // with three stone treads, stepping down to street level at the back.
  const apronStart=marketDeck.x+marketDeck.w,apronEnd=wall.x-wall.half-.03;
  const apronFront=marketDeck.y+marketDeck.d,apron=[];
  for(let i=0;i<3;i++){
    const left=lerp(apronStart,apronEnd,i/3),right=lerp(apronStart,apronEnd,(i+1)/3);
    const top=.42+i*.20;
    for(const s of bridgeSteps){
      const z=Math.min(top,s.top);
      apron.push({left,right,back:s.start,front:z===top?apronFront:s.end,z});
      if(z===top)break;
    }
  }
  const toeStones=Array.from({length:28},(_,i)=>({
    x:wall.x+wall.half+.14+.16*hash(i,4),y:lerp(wall.root+.35,wall.tip,i/27),r:.31+.21*hash(i,11)
  }));
  const beach = y => -6.9 - .25*y + .85*Math.cos(y*.35);
  const shelf = (x,y) => Math.max(9.9-x, y-1.75-(x-9.9)*.88);
  function shore(x,y){
    const bay=Math.min((x-beach(y))*.93,y-quay,shelf(x,y));
    // The sandy headland curls into the inlet; the open channel passes its tip.
    const headlandTip=12.15+.18*(x+12)+1.05*Math.cos(x*.62);
    const inner=Math.max(bay,y-headlandTip);
    if(x< -12) return lerp(inner,y-westCove(x),ease(clamp((-12-x)/5,0,1)));
    if(x>13) return lerp(inner,y-yardEdge(x),ease(clamp((x-13)/4.8,0,1)));
    return inner;
  }
  // Rounded corners on the cutaway still read as a diamond under projection.
  function terrainRim(x,y) {
    const u=Math.abs(x)-(landHalf-2.65), v=Math.abs(y+5.8)-16.6;
    return 2.65-Math.hypot(Math.max(0,u),Math.max(0,v))-Math.min(Math.max(u,v),0);
  }
  function rim(x,y) {
    // One continuous cutaway for rock, beach and sea. The two banks gradually
    // open towards the mouth, sharing the land's outer silhouette at the quay.
    if(y<=quay)return terrainRim(x,y);
    const t=ease(clamp((y-quay)/23,0,1));
    const u=Math.abs(x)-(landHalf-2.65+1.4*t),v=y-(seaFront-2.65);
    return 2.65-Math.hypot(Math.max(0,u),Math.max(0,v))-Math.min(Math.max(u,v),0);
  }
  // Hull dimensions and heading drive both the paint and its collision proxy.
  const fishingBoats=[
    {x:15.55,y:4.4,angle:.10,length:3.65,beam:1.29,phase:.7,kind:'trawler',
      ties:[[16.65,3.1,.38],[16.65,5.65,.38]]},
    {x:-2.95,y:7.55,angle:1.37,length:3.48,beam:1.22,phase:3.35,kind:'potter',
      ties:[[-5.27,6.87,.33],[-.73,8.36,.33]]},
  ];
  function hullClearance(x,y,boat){
    const dx=x-boat.x,dy=y-boat.y,c=Math.cos(boat.angle),s=Math.sin(boat.angle);
    const along=dx*s+dy*c, across=dx*c-dy*s;
    const stem=(boat.length-boat.beam)/2;
    return Math.hypot(along-clamp(along,-stem,stem),across)-boat.beam/2;
  }
  function wallDistance(x,y) {
    return Math.hypot(x-wall.x,y-clamp(y,wall.root,wall.tip))-wall.half;
  }
  function pierDistance(x,y,p) {
    const u=(x-p.x)*p.dx+(y-p.y)*p.dy,v=(x-p.x)*p.dy-(y-p.y)*p.dx;
    return Math.hypot(u-clamp(u,-.13,p.length),Math.max(0,Math.abs(v)-(p.halfWidth??.40)));
  }
  function navigable(x,y) {
    const clearance=.57;
    const deckGap=Math.hypot(Math.max(0,Math.abs(x-marketDeck.x)-marketDeck.w),
      Math.max(0,Math.abs(y-marketDeck.y)-marketDeck.d));
    const apronGap=Math.hypot(x-clamp(x,apronStart,apronEnd),y-clamp(y,bridgeSteps[0].start,apronFront));
    return apronGap>clearance && rim(x,y)>clearance && shore(x,y)>clearance && wallDistance(x,y)>clearance
      && deckGap>clearance
      && toeStones.every(s=>Math.hypot(x-s.x,y-s.y)>s.r+clearance)
      && piers.every(p=>pierDistance(x,y,p)>clearance)
      && fishingBoats.every(boat=>hullClearance(x,y,boat)>clearance)
      && reefs.every(([rx,ry,r])=>Math.hypot(x-rx,y-ry)>r+clearance);
  }
  // Only hulls block open water. Docks and stonework own their exact tops;
  // a second padded swimming exclusion around them would strand the swimmer.
  function clearOfMooredBoats(x,y){
    if(hullClearance(x,y,rentalHull)<.12)return false;
    return fishingBoats.every(boat=>hullClearance(x,y,boat)>.13);
  }
  function waterfrontTop(x,y){
    const dx=Math.abs(x-wall.x),tipY=Math.abs(y-wall.tip);
    if(dx<=1.02&&tipY<=.92)return Math.hypot(dx,tipY)<.64?NaN:1.13;
    if(dx<=wall.half+.03&&y>=wall.root&&y<=wall.tip)return 1.02;
    if(dx<=wall.half+.03&&y<wall.root){
      const tread=bridgeSteps.find(s=>y>=s.start&&y<s.end);
      if(tread)return tread.top;
    }
    if(x>=apronStart&&x<=apronEnd&&y>=bridgeSteps[0].start&&y<=apronFront){
      const tread=apron.find(s=>x>=s.left&&x<=s.right&&y>=s.back&&y<=s.front);
      if(tread)return tread.z;
    }
    for(const p of piers){
      const u=(x-p.x)*p.dx+(y-p.y)*p.dy,v=(x-p.x)*p.dy-(y-p.y)*p.dx;
      if(u>=-.13&&u<=p.length&&Math.abs(v)<=(p.halfWidth??.40))return .32;
    }
    const mx=x-marketDeck.x,my=y-marketDeck.y;
    if(Math.abs(mx)<=marketDeck.w&&Math.abs(my)<=marketDeck.d){
      const w=marketDeck.w-.15,d=marketDeck.d-.12;
      if(Math.abs(mx)<=w&&my>=-d&&my<=-.46)return NaN;
      if(Math.abs(Math.abs(mx)-w*.51)<.77&&my>d-.70&&my<d-.11)return NaN;
      if(my>=d-.23&&my<=d+.09&&(Math.abs(mx)<=.15||Math.abs(Math.abs(mx)-(w-.10))<=.15))return NaN;
      return .42;
    }
    let top=null;
    function rock(rx,ry,r,centerZ){
      const horizontal=(x-rx)**2+(y-ry)**2;
      if(horizontal<=r*r)top=Math.max(top||0,centerZ+Math.sqrt(r*r-horizontal));
    }
    if(x>wall.x+wall.half-.5&&x<wall.x+wall.half+.83&&y>wall.root-.2&&y<wall.tip+.53){
      for(const s of toeStones)rock(s.x,s.y,s.r,.22);
    }
    for(const [rx,ry,r] of reefs)rock(rx,ry,r,.30*r);
    if(x>8.9&&x<14.2&&y<6)for(const [rx,ry,r] of shoreRocks)rock(rx,ry,r,.48*r);
    return top;
  }
  function berth(name,x,y,dx,dy,landing,walkway) {
    const heading=Math.atan2(dx+dy,dx-dy);
    return {name,a:(x-y)/R2,w:(x+y)/R2,heading,landing,walkway};
  }
  const names=['西沙滩','鱼市','咖啡店','贝壳湾浴场','东岬船厂'];
  const docks=piers.map((p,i)=>{
    const landing=[p.x+(p.length-.14)*p.dx,p.y+(p.length-.14)*p.dy,.34];
    const walk=[[p.x-.62*p.dx,p.y-.62*p.dy,.03],[p.x,p.y,.34],landing];
    if(p.name==='market pier'){
      landing[0]+=.42;
      return berth(names[i],p.x-.86,p.y+p.length+1.08,-1,0,landing,walk);
    }
    return berth(names[i],p.x+(p.length+1.45)*p.dx,p.y+(p.length+1.45)*p.dy,p.dx,p.dy,landing,walk);
  });
  const lightLanding=[wall.x+.75,wall.tip+.30,1.13];
  docks.push(berth('灯塔',wall.x+2.15,wall.tip+.3,1,0,lightLanding,
    [[wall.x+.5,wall.tip-2.90,1.02],[wall.x+.68,wall.tip-.70,1.13],lightLanding]));
  let rentalDock=docks[1];
  const rentalHull={length:3.06,beam:1.12};
  function moorAt(dock){
    rentalDock=dock;
    Object.assign(rentalHull,{x:(dock.a+dock.w)/R2,y:(dock.w-dock.a)/R2,angle:3*Math.PI/4-dock.heading});
  }
  moorAt(rentalDock);
  // Sunlit sand, turquoise shelf, then the cooler open-water channel.
  const waterStops=[[225,255,215],[112,248,201],[28,227,195],[8,197,207],
    [7,166,209],[11,129,195],[21,96,173]];
  function gradient(stops,t) {
    const k=clamp(t,0,stops.length-1), lo=stops[Math.floor(k)],hi=stops[Math.ceil(k)];
    return rgb(...lo.map((v,i)=>lerp(v,hi[i],k%1)));
  }
  function color(x,y,ix,iy,i) {
    const edge=rim(x,y), grain=hash(ix,iy);
    if(edge<0)return 0;
    const d=shore(x,y), n=noise(x*.58,y*.58), wave=noise(ix*.17,iy*1.65);
    if(d>0) {
      const depth=Math.min(d,wallDistance(x,y)+.4,...reefs.map(([rx,ry,r])=>Math.hypot(x-rx,y-ry)-r));
      if(depth<.21 && wave>.40)return rgb(235,251,221);
      if(wave>.87 && grain>.43)return rgb(147,237,237);
      return gradient(waterStops,Math.sqrt(Math.max(0,depth))*1.72+(n-.5)*.57+(grain-.5)*.12);
    }
    if(y<quay+.06 && y>oldTown.shopStreet.back-.16) {
      return oldTown.promenadeColor(x,y,n,grain);
    }

function harborFace(points,color){
  const corners=points.map(p=>project(...p));
  for(let j=1;j<corners.length-1;j++){
    const [a,b,c]=[corners[0],corners[j],corners[j+1]];
    const bx=b.sx-a.sx,by=b.sy-a.sy,cx=c.sx-a.sx,cy=c.sy-a.sy;
    const area=bx*cy-by*cx;
    if(Math.abs(area)<.001)continue;
    const minX=Math.max(0,Math.floor(Math.min(a.sx,b.sx,c.sx)));
    const maxX=Math.min(W-1,Math.ceil(Math.max(a.sx,b.sx,c.sx)));
    const minY=Math.max(0,Math.floor(Math.min(a.sy,b.sy,c.sy)));
    const maxY=Math.min(H-1,Math.ceil(Math.max(a.sy,b.sy,c.sy)));
    for(let iy=minY;iy<=maxY;iy++)for(let ix=minX;ix<=maxX;ix++){
      const x=ix+.5-a.sx,y=iy+.5-a.sy;
      const u=(x*cy-y*cx)/area,v=(bx*y-by*x)/area;
      if(u<0||v<0||u+v>1)continue;

    [5.1,-12.45],[.9,-13.15],[4.5,-14.45],[2.7,-13.55],[3.7,-12.6]];

    {skin:[217,163,125],cap:[56,133,166]}, {skin:[231,184,148],hair:[168,162,146]}

    if(STILL||time<flyStart)return -1;
    const t=(time-flyStart)%flyPeriod;return t<flyDuration?t:-1;
  }
  function flight(t){
    const section=Math.min(2,Math.floor(t/4)),u=t/4-section;

  }
  // The same doorway and step are used by the coach artwork and every passenger.
  function door(x,y){return [x+.70*coach.halfLength/1.12,y-coach.halfWidth];}

    }
  }

    const {section,u,arc,x,y,z}=flight(t),reach=Math.cos(Math.PI*u);
    // The middle strand catches the real clock tower finial. The outer anchors
    // are above the visible sky; both ends of the flight pass beyond the canvas.
    const bell=oldTown.trail.rows.at(-1);
    const anchors=[[-41,-22,39],[-1.65,-22.45,bell.z+7.45],[39,-20,53]];
    const size=1.16;
    const p=(a,b,h)=>[x+size*(a+.30*h*reach),y+size*b,z+size*h];
    const hand=p(.44+.35*reach,.04,1.70);
    const anchor=anchors[section],extension=ease(clamp(u/.12,0,1));

      filament(hand,end,rgb(123,164,179));filament([hand[0],hand[1]+.06,hand[2]+.09],[end[0],end[1],end[2]+.09],rgb(232,245,240));
    }
    const limb=(a,b,r,c)=>capsule(a,b,r*size,r*size*.80,()=>c,'solid');
    for(const s of [-1,1]){
      const knee=p(s*.45-.11,s*.21,.48+s*.25*arc),toe=p(-.56+s*.40,s*.22,.16+s*.29*arc);

    limb(p(.09,-.17,1.13),p(.27,-.14,1.45),.103,blue);limb(p(.27,-.14,1.45),hand,.087,scarlet);

    sphere(...p(.17,0,1.43),.29,scarlet,'solid');

      sphere(...p(.375,side*.118,1.49),.095,[251,244,220],'solid');

<script>

  const {road,pickupModel:model}=oldTown,roadY=road.center,edge=harbor.landHalf;
  const state={...road.bays[3],heading:0,speed:0,driving:false};
  const paint=[[42,129,120],[56,157,139],[44,135,127],[31,95,95],[109,190,151]];
  let target=null,parking=null,suggested=null,crossing=null;
  const gate=edge-.88,offRoad=edge+Math.hypot(model.halfLength,model.halfWidth)+.25;
  let impact=null,recoil=null;

  }
  function blocks(x,y){return !state.driving&&Math.abs(x-state.x)<model.halfLength+.12&&Math.abs(y-state.y)<model.halfWidth+.10;}
  function roadPosition(y,heading){

    const breadth=Math.abs(Math.sin(heading))*model.halfLength+Math.abs(Math.cos(heading))*(model.halfWidth+.035);
    return clamp(y,road.inner+breadth,road.outer-breadth);

    impact=null;recoil=null;suggested=null;pedestrianBrake=0;contacts.clear();

  function park(){

    const bay=road.bays.reduce((best,b)=>Math.abs(b.x-state.x)<Math.abs(best.x-state.x)?b:best);
    suggested=bay;
    if(Math.abs(bay.x-state.x)>3.1||state.y>roadY+.08){
      return '请驶近店铺侧亮起的 P 车位，再按 E 泊车';
    }

    const endX=bay.x,endY=bay.y;

      ay:clamp(state.y+Math.sin(state.heading)*reach,road.bayY,road.outer-model.halfWidth),
      bx:clamp(endX-dir*reach,endX-1.1,endX+1.1),by:endY,endHeading:dir>0?0:Math.PI};

  function aim(p){
    if(parking||crossing)return;

    let left=Infinity,right=-Infinity;
    const cs=Math.cos(heading),sn=Math.sin(heading),width=model.halfWidth+other.halfWidth+.05;

    for(const u of [-spine,0,spine]){

      if(Math.abs(dy)>=width)continue;
      const reach=other.halfLength-other.halfWidth+Math.sqrt(width*width-dy*dy),cx=x+u*cs;

  function blockingCar(x,y,heading){

      // allows through traffic to enter when both cars meet head-on.
      const options=[state.y,lane,road.bayY];

    // reserve the whole short merge path so following traffic yields to it.
    if(crossing?.leg==='wait')return null;

      const nx=s*s*s*x+3*s*s*t*ax+3*s*t*t*bx+t*t*t*endX;

    const east=Number(keys.has('d')||keys.has('ArrowRight'))-Number(keys.has('a')||keys.has('ArrowLeft'));

    const laneY=target&&Math.abs(target.x-state.x)>4?roadY-Math.sign(vx)*road.lane:target?.y;

  }
  function update(dt){
    const x=state.x,y=state.y;

    if(suggested&&state.driving){

  }

<script>
// Exhaust stays in world space after it leaves the tailpipe.
const streetExhaust=(()=>{
  const puffs=[],timers=new Map();
  function update(dt){
    if(STILL||dt<=0)return;
    for(let i=puffs.length-1;i>=0;i--){
      const p=puffs[i];p.age+=dt;
      if(p.age>=p.life){puffs.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=dt*(.43+.28*p.power);
    }
    function emit(id,x,y,heading,speed,model){
      if(speed<.35){timers.delete(id);return;}
      const power=clamp(speed/12,0,1),cs=Math.cos(heading),sn=Math.sin(heading);
      const back=model.halfLength+.12,side=model.halfWidth*.57;
      const px=x-back*cs-side*sn,py=y-back*sn+side*cs;
      if(Math.abs(px)>harbor.landHalf){timers.delete(id);return;}
      const interval=.45-.34*power;
      const elapsed=(timers.get(id)??interval*.5)+dt;
      if(elapsed>=interval){
        const spread=(hash(id,Math.floor(G.clock*100))-.5)*.44,kick=.50+1.7*power;
        puffs.push({x:px,y:py,z:.27,age:0,power,life:.49+.20*power,
          vx:-cs*kick-sn*spread,vy:-sn*kick+cs*spread});
      }
      timers.set(id,elapsed%interval);
    }
    oldTown.traffic((x,y,dir,paint,id,speed,model)=>emit(id,x,y,dir>0?0:Math.PI,speed,model));
    const truck=harborTruck.state;
    emit(-1,truck.x,truck.y,truck.heading,truck.driving?truck.speed:0,oldTown.pickupModel);
  }
  function draw(){
    for(const puff of puffs){
      const t=puff.age/puff.life,p=project(puff.x,puff.y,puff.z);
      const r=(.11+.15*puff.power+t*(.10+.20*puff.power))*S;
      const cx=Math.round(p.sx),cy=Math.round(p.sy),radius=Math.ceil(r);
      for(let y=Math.max(0,cy-radius);y<=Math.min(H-1,cy+radius);y++){
        for(let x=Math.max(0,cx-radius);x<=Math.min(W-1,cx+radius);x++){
          const dx=(x-cx)/r,dy=(y-cy)/r,d=dx*dx+dy*dy;
          if(d>1)continue;
          const i=y*W+x;
          if(p.d<=zb[i])continue;
          const alpha=(.46+.20*puff.power)*(1-t)*(1-.42*d),under=pix[i];
          const shade=dy<-.12?207:181;
          pix[i]=rgb(lerp(under&255,shade,alpha),lerp((under>>>8)&255,shade+5,alpha),lerp((under>>>16)&255,shade+3,alpha));
          zb[i]=p.d;
        }
      }
    }
  }
  return {update,draw};
})();

</script>
<script>
// Loop a firing pattern at variable RPM. Each vehicle keeps its own motor and
// stereo position, even when two of the same model pass one another.
const roadAudio=(()=>{
  const motors=new Map(),loops=new Map();
  let nextUpdate=0,viewCenter=W/2,halfView=W/2;
  function camera(offset,width,scale){
    viewCenter=W/2-offset/scale;halfView=width/(2*scale);
  }
  function pan(x,y){
    return clamp((project(x,y,.7).sx-viewCenter)/Math.max(1,halfView),-1,1)*.9;

<script>
// A coastal breeze carries low cumulus across the town and its waterfront.
const harborSky = (() => {
  function cumulus(seed, width){
    const height=Math.ceil(width*(.31+.12*hash(seed,2))), cells=[];
    const lobes=[];
    for(let j=0;j<13;j++){
      const cx=.10+j*.065+.032*hash(j,seed), crown=Math.sin(Math.PI*j/12);
      const rx=.078+.066*hash(seed,j+8)+.044*crown;
      const ry=.10+.12*hash(j,seed+6)+crown*.16;
      lobes.push([cx,.75-crown*(.13+.29*hash(seed+3,j)),rx,ry]);
    }
    const tones=[[183,197,213],[197,209,222],[211,222,231],[224,233,238],
      [237,242,244],[246,249,248],[252,252,246]];
    for(let y=0;y<height;y++)for(let x=0;x<width;x++){
      const u=x/width,v=y/height,grain=noise(x*.20+seed,y*.28);
      let front=-Infinity, light=0, thickness=0;
      for(const [cx,cy,rx,ry] of lobes){
        const dx=(u-cx)/rx,dy=(v-cy)/ry;
        const shell=1-dx*dx-dy*dy+(grain-.50)*.20;
        if(shell<=0)continue;
        const nz=Math.sqrt(shell),depth=nz*ry+cy*.24;
        if(depth<front)continue;
        front=depth;light=.55*nz-.26*dx-.68*dy;thickness=nz;
      }
      if(front===-Infinity)continue;
      const band=clamp(Math.floor(3+3.7*light+(grain-.5)*.8-(v-.5)*1.7),0,6);
      cells.push([x,y,rgb(...tones[band]),.32+.66*thickness]);
    }
    // View from the sun: use the same lobes for the shadow, with a soft rim.
    const maskHeight=Math.ceil(width*.62), mask=new Uint8Array(width*maskHeight);
    for(let y=0;y<maskHeight;y++)for(let x=0;x<width;x++){
      let density=0;
      for(const [cx,cy,rx,ry] of lobes){
        const dx=(x/width-cx)/(rx*1.14);
        const dy=(y/maskHeight-(.53+(cy-.6)*.33))/(ry*1.28);
        density=Math.max(density,clamp((1-dx*dx-dy*dy)*1.38,0,1));
      }
      mask[y*width+x]=Math.round(ease(density)*255);

    return {cells,width,height,mask,maskHeight};
  }
  const clouds=[], gulls=[];
  const lightU=(SHADOW_X-SHADOW_Y)/R2, lightV=(SHADOW_X+SHADOW_Y)/R2;
  const coverage=new Uint8Array(W*H), touched=new Int32Array(W*H);

  function flightObstacles(){

    function record(x,y,z){
      if(z<1||x< -20||x>20||y< -5||y>19)return;
      const key=Math.floor(x)+64*Math.floor(y);
      cells.set(key,Math.max(z,cells.get(key)||0));
    }

      const depth=bakedZ[i];if(depth< -1e8)continue;
      const q=(Math.floor(i/W)+.5-OY)/S,u=(i%W+.5-OX)/S,v=q*SIN+depth*COS;
      record((v+u)/R2,(v-u)/R2,depth*SIN-q*COS);

  }
  function flightPath(bird,a){
    return {x:1+(12+bird.lane)*Math.cos(a),y:7.6+(7.2+bird.lane*.48)*Math.sin(a)};
  }
  function flightProfile(bird,cells){
    const count=96,heights=[];
    for(let i=0;i<count;i++){
      const {x,y}=flightPath(bird,i*2*Math.PI/count);
      let ground=0;
      for(let u=Math.floor(x)-2;u<=Math.floor(x)+2;u++)for(let v=Math.floor(y)-2;v<=Math.floor(y)+2;v++)
        ground=Math.max(ground,cells.get(u+64*v)||0);

    const firstTier=Math.floor(range(0,3));
    for(let i=0;i<3;i++){
      const x=west+(i+range(.30,.72))*fetch/3;
      const tier=(firstTier+i)%3;
      const altitude=range(17.4,18.1)+2.4*tier;
      const y=range(-10.9,-8.4)-tier*.65;
      const width=i===lead?range(5.5,6.6):range(3.2,4.9);
      clouds.push({x,y,altitude,phase:range(0,6.28),art:cumulus(range(1,1e6),Math.round(width*S))});

          const my=Math.floor(((q*SIN+depth*COS)+height*lightV-baseV)*S+radiusV);

    for(const cloud of clouds){
      const {u,v,opacity}=position(cloud,time);

      const x0=Math.round(p.sx-cloud.art.width/2),y0=Math.round(p.sy-cloud.art.height/2);
      for(const [x,y,color,density] of cloud.art.cells){
        const px=x0+x,py=y0+y;

  // At a shallow viewing angle a wing can be less than one pixel thick.
  function wingEdge(start,end,color){
    const steps=Math.ceil(Math.hypot(end[0]-start[0],end[1]-start[1],end[2]-start[2])*S);
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      plot(lerp(start[0],end[0],t),lerp(start[1],end[1],t),lerp(start[2],end[2],t),color);
    }

  function drawBirds(time){
    const t=STILL?0:time;

        const back=p(-.16,side*bird.span*.52,.10+flap*.22);
        const end=p(-.19,side*bird.span*(1-.16*Math.abs(flap)),.055+flap*.53);

        const outer=end.map((v,i)=>lerp(wrist[i],v,.62));
        const trailing=end.map((v,i)=>lerp(back[i],v,.62));

  }
  return {reset,drawBirds,drawClouds,shade};
})();

<script>

const shipping=(()=>{

  const entryY=10;

<script>
// All splashes, shadows, hulls and lines go through the harbor depth buffer.
const harborSea=(()=>{
  const salt=rgb(238,250,230), wash=rgb(161,227,217), swell=rgb(90,189,201);
  const charcoal=rgb(53,67,68), rope=rgb(121,95,65), pine=rgb(174,135,89);
  const ivory=rgb(236,225,193), glass=rgb(75,117,132);
  function line(a,b,color){
    const steps=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2])*16));
    for(let j=0;j<=steps;j++){
      const t=j/steps;
      plot(lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t),color);
    }
  }
  function waterRipple(x,y,length,color,z=.08){
    line([x,y,z],[x+length,y-length,z],color);
  }
  const highlights=[];
  for(let i=0;i<1350;i++){
    const x=lerp(-harbor.landHalf-1.4,harbor.landHalf+1.4,hash(i,83)),y=lerp(-8,harbor.seaFront,hash(i,115));
    if(harbor.rim(x,y)<1 || harbor.shore(x,y)<.85)continue;
    highlights.push({x,y,offset:hash(i,72)*6.28,rate:.8+hash(i,73),length:.13+hash(i,74)*.48});
  }
  // Broken crests bend towards the apron of stones. The outgoing wash
  // grows sideways and thins as the next section of the wall is struck.
  function breakers(time){
    const wall=harbor.wall, contact=wall.x+wall.half+.38;
    for(let patch=0;patch<6;patch++){
      const center=wall.root+1.25+patch*2.13;
      const cycle=(time*.255+patch*.24+.38)%1;
      for(let i=0;i<34;i++){
        const t=i/33, along=(t-.5)*2.56;
        const phase=cycle-.065*Math.abs(along);
        if(phase<0)continue;
        const y=center+along;
        if(phase<.5){
          const travel=(.50-phase)*5.4;
          const x=contact+travel+.12*Math.cos(along*3.5);
          const color=phase>.36?wash:swell;
          if(Math.cos(along*7+patch*.8)>.18-phase){
            plot(x,y,.12,color);
            if(phase>.32)plot(x+.09,y,.105,wash);
          }
          continue;
        }
        const age=(phase-.5)*2, lift=Math.sin(Math.min(1,age*3.1)*Math.PI);
        const spread=(.10+1.20*age)*(.64+.34*Math.cos(along*2.4));
        const ripple=contact+spread+.10*Math.sin(along*7+patch);
        if(hash(i,patch+15)>.88*age){
          plot(ripple,y,.12,age<.55?salt:wash);
          plot(ripple+.08,y,.10,wash);
        }
        if(age<.58){
          const height=(.47+.68*hash(i,patch+21))*lift;
          line([contact+.03,y,.13],[contact-.23*lift,y,.18+height],i%4===0?wash:salt);
          if(i%3===0)plot(contact-.31*lift,y+.04,.28+height*1.15,salt);
        }
      }
    }
  }

    coaster:{hull:rgb(41,113,146),shadow:rgb(38,76,100),roof:rgb(245,179,63)},
    trawler:{hull:rgb(43,134,126),shadow:rgb(34,80,91),roof:rgb(52,132,111)},
    potter:{hull:rgb(195,78,52),shadow:rgb(119,55,46),roof:rgb(199,101,53)},
  };

    const phase=time*1.38+boat.phase, tilt=Math.sin(phase)*.085;
    const heading=boat.angle+.028*Math.sin(phase*.72);
    const ca=Math.cos(heading),sa=Math.sin(heading),heave=.14*Math.sin(phase);

    }

    function stroke(a,b,col){line(p(...a),p(...b),col);}
    function crate(u,v,z,l,w,h,front,roof){
      const u1=u+l,v1=v+w,top=z+h;
      shape([[u,v,z],[u,v1,z],[u,v1,top],[u,v,top]],front);
      shape([[u1,v,z],[u1,v1,z],[u1,v1,top],[u1,v,top]],front);
      for(const side of [v,v1])shape([[u,side,z],[u1,side,z],[u1,side,top],[u,side,top]],front);
      shape([[u,v,top],[u1,v,top],[u1,v1,top],[u,v1,top]],roof);
    }
    const profile=[[-.50,.55],[-.40,.91],[-.18,1],[.17,.96],[.36,.7],[.50,0]];
    const stern=-length/2, transom=half*.55;
    shape([[stern,-transom*.72,.11],[stern,transom*.72,.11],[stern,transom,.64],[stern,-transom,.64]],paint.shadow);
    for(let i=1;i<profile.length;i++){
      const [au,av]=profile[i-1],[bu,bv]=profile[i];
      const a=au*length,b=bu*length,h=.64;
      const v0=av*half,v1=bv*half;
      for(const sign of [-1,1]){
        const l=v0*sign,r=v1*sign;
        shape([[a,l*.72,.11],[b,r*.72,.11],[b,r,.49],[a,l,.49]],sign>0?paint.hull:paint.shadow);
        shape([[a,l,.49],[b,r,.49],[b,r,h],[a,l,h]],ivory);
        stroke([a,l,.35],[b,r,.35],paint.shadow);
        stroke([a,l,h+.035],[b,r,h+.035],charcoal);
      }

    }
    const back=trawler?-.18:-.77,cabinLength=trawler?.98:.86;
    crate(back,-half*.74,.65,cabinLength,half*1.48,.62,ivory,ivory);

    const mast=trawler?-.59:.64,top=trawler?2.77:2.30;
    stroke([mast,0,.66],[mast,0,top],rope);
    stroke([mast,-.42,top-.38],[mast,.48,top-.38],charcoal);
    stroke([mast,0,top-.15],[length*.43,0,.69],charcoal);
    stroke([mast,0,top-.33],[-length*.45,-half*.54,.69],rope);
    shape([[mast,0,top],[mast,0,top-.23],[mast-.44,.03,top-.16]],trawler?rgb(193,82,55):rgb(224,179,73));
    if(trawler){
      crate(-1.31,-.37,.66,.41,.41,.24,paint.shadow,rgb(114,151,127));
      crate(-1.20,.10,.66,.46,.34,.20,rope,rgb(191,151,92));
    }else{
      for(const u of [.32,.89])crate(u,-.26,.65,.43,.51,.27,rope,pine);
    }
    if(!boat.ties){
      for(const sign of [-1,1])for(let j=0;j<11;j++){
        const u=-length*.42-j*.19,v=sign*(half*.82+j*.067);
        if(j>4&&Math.sin(j-time*5)<-.35)continue;

      const start=p(u,half*.74,.62),end=boat.ties[i];
      const mid=[(start[0]+end[0])/2,(start[1]+end[1])/2,(start[2]+end[2])/2-.12];
      line(start,mid,rope);line(mid,end,rope);
    }
  }
  function draw(time){
    for(const r of highlights){
      const shine=Math.sin(time*r.rate+r.offset);
      if(shine<.57)continue;
      waterRipple(r.x+.14*Math.sin(time*.58+r.offset),r.y,r.length*(shine-.45),shine>.92?wash:swell);
    }
    breakers(time);
    for(const boat of harbor.fishingBoats)fishingBoat(boat,time);
    const coaster=shipping.vessel(time);
    if(coaster)shipping.drawClipped(coaster.x,coaster.y,()=>fishingBoat(coaster,time));
  }
  return {draw};
})();

<script>

const courier = (() => {
  const market=1, cafe=2;
  const blue=rgb(43,85,225), chalk=rgb(251,242,208), ink=rgb(30,48,79);
  const timber=rgb(183,126,61), ice=rgb(217,235,223), fish=rgb(67,127,146);
  const duration=2.05, settle=.57;
  const mid=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));

  }

  function canWalk(x,y){
    if(x< -5||x>5||y< -3.45||y>3.77)return false;
    if(decor){
      const person=decor.resident;
      if(Math.hypot(x-person.x,y-person.y)<.52)return false;
      return !decor.obstacles.some(([left,back,right,front])=>x>=left&&x<=right&&y>=back&&y<=front);
    }
    if(x<-.48&&y< -1.02)return false;
    if(x< -4.48&&y>2.55)return false;
    return tables.every(([tx,ty])=>Math.abs(x-tx)>.88||Math.abs(y-ty)>1.19);
  }
  function enter(key='cafe'){
    location=key;decor=townRooms[key];

  function nearby(){

      const stationGap=Math.hypot(x-decor.station.x,y-decor.station.y);
      const personGap=Math.hypot(x-decor.resident.x,y-decor.resident.y);

  function closeChair(){

  // Half-metre floor tiles provide tap routes around chairs and the counter.
  function tap(p){

      const atPerson=Math.abs(p.x-body.sx)<4.5&&Math.abs(p.y-body.sy)<7.5;

  function walkTo(goal){
    const h=foot.hero,id=(x,y)=>(y+7)*21+x+10;
    const start={x:Math.round(h.x*2),y:Math.round(h.y*2),prev:null};
    const queue=[start],seen=new Set([id(start.x,start.y)]);let best=start,bestDist=Infinity;

  function update(dt){
    const h=foot.hero;

    const down=Number(keys.has('s')||keys.has('ArrowDown'))-Number(keys.has('w')||keys.has('ArrowUp'));
    let dx=right+down,dy=down-right,step=dt*3.25;

    const norm=Math.hypot(dx,dy),x=h.x,y=h.y;

      wantedSeat=null;

  function journal(){
    if(harborTruck.state.driving||interiors.active)return;
    route=[];keys.clear();

    function entry(text,key){

      entry((completed?'✓ ':active===i?'进行中 · ':'')+t.name+'　'+(completed?'已盖章':places[key].name),completed||active!==null&&active!==i?null:key);
    });

    entry('去拱廊咖啡馆 · 进店', 'cafe');

  function ashore(x,y){

    bodyZ=z;splash=null;speedMarks.length=0;air=0;velocity=0;releaseJump();
    jumped=false;lastRun=-Infinity;swimBurst=0;
    bounce=null;immunity=0;routeAfterBounce=null;route=[];passage=null;exitTarget=null;

  }
  return {prepare,hero,update,tap,interact,jump,releaseJump,journal,drawPeople,drawHero,labels,playerPin,sync,ashore,places,dest,
    cafeOrder:()=>action('cafe'),serveCafe:()=>finishInteraction('cafe')};
})();

</script>
<script>
'use strict';

const HC_SIGNAL=rgb(255,211,62), DELIVERY=rgb(100,193,255), MARKER_SHADOW=rgb(30,63,84);
const world=(a,w,z=0)=>[(a+w)/R2,(w-a)/R2,z];

function scenery(){
  oldTown.bake();
  coastDistricts.bake();
  for(const [x,y,scale] of [[-13.9,-3.7,.71],[-13.3,-.8,.50],[-12.7,4.8,.60],
    [-13.65,6.65,.47],[13.2,-3.25,.45]]) {
    growTree(x,y,scale,210,Math.round((x+y)*11));
  }
  for(const [x,y,r] of harbor.shoreRocks)sphere(x,y,r*.48,r,[102,99,88],'rough');
  const umbrella=[-9,3.3];
  capsule([...umbrella,0],[...umbrella,1.58],.07,.07,()=>[107,87,64],'rough');
  for(let r=.04;r<1.06;r+=.044)for(let j=0;j<112;j++){
    const a=j*Math.PI/56;
    plot(umbrella[0]+r*Math.cos(a),umbrella[1]+r*Math.sin(a),1.99-r*.49,
         Math.floor(j/14)%2?rgb(247,71,52):rgb(255,242,202));
  }
  castShadow(...umbrella,1.8,1.03);
  harbor.stonework();
  for(const sign of [-1,1])for(const y of [-11.83,-6.52]){
    const x=sign*(harbor.landHalf-.75);
    for(const side of [-1,1])capsule([x-sign*.48,y+side*.24,.035],[x,y,.035],.05,.05,()=>[223,182,97],'solid');
  }
  shipping.bake();
  courier.bake();
}
function bake(){
  zb.fill(-1e9);pix.fill(rgb(255,255,255));kinds.fill(KIND_NONE);
  for(let iy=0;iy<H;iy++)for(let ix=0;ix<W;ix++){
    const g=unproject(ix+.5,iy+.5),i=iy*W+ix,c=harbor.color(g.x,g.y,ix,iy,i);
    if(!c)continue;pix[i]=c;ground[i]=1;zb[i]=(g.x+g.y)/R2*COS;
  }
  harborCutaway.bake();
  growGrass();groundZ.set(zb);scenery();bakeHarborContacts();staticShadow.set(shadowMask);applyShadows(groundZ);bakedPix.set(pix);bakedZ.set(zb);
}

const DOCKS=harbor.docks;
const G={phase:'ready',time:60,score:0,cargo:false,pickup:0,drop:2,boat:{a:0,w:0,va:0,vw:0},target:null,bump:0,status:'',clock:0};
const keys=new Set();
let onFoot=true;
let slowingToStop=false;
function setVehicleControls(mode){
  document.getElementById('leap').hidden=mode!=='walk';
  const button=document.getElementById('brake');
  button.hidden=mode==='walk';button.textContent=mode==='boat'?'减速':'刹车';
  slowingToStop=false;keys.delete('brake');
}
function brakingAt(speed){
  const active=slowingToStop||keys.has('brake');
  if(speed<=0)slowingToStop=false;
  return active;
}
let touchSprint=false;
function boostHeld(){return keys.has('shift')||touchSprint;}
function setTouchSprint(enabled){
  touchSprint=enabled;document.getElementById('run').setAttribute('aria-pressed',String(enabled));
}
const nodes={score:document.getElementById('score'),time:document.getElementById('time'),job:document.getElementById('job'),status:document.getElementById('status')};
function setStatus(s){if(G.status===s)return;G.status=s;nodes.status.textContent=s;}
function chooseJob(first=false){
  if(first){
    G.pickup=courier.market;G.drop=courier.cafe;
    const port=name=>DOCKS.findIndex(d=>d.name===name);
    const west=[port('西沙滩'),port('贝壳湾浴场')];
    if(Math.random()<.5)west.reverse();
    G.itinerary=[port('东岬船厂'),port('灯塔'),...west];
  }
  else{
    G.pickup=G.drop;G.drop=G.itinerary.shift();
  }
  G.cargo=false;
  courier.dispatch(G.hands[G.pickup],'send');
  nodes.job.textContent=(first?'首单':'取货')+' · '+DOCKS[G.pickup].name+' → '+DOCKS[G.drop].name;
}
function resetGame(){
  Object.assign(G,{phase:'ready',time:60,score:0,cargo:false,target:null,bump:0,hands:courier.fresh(),service:null,transit:null});
  Object.assign(G.boat,{a:-2.8,w:1.85,va:0,vw:0,heading:-2.4});
  keys.clear();chooseJob(true);nodes.score.textContent='0';nodes.time.textContent='60';setStatus('驾驶蓝顶小船去鱼市 · 方向键 / WASD 或点水面');
}
function travelHud(){
  setVehicleControls(onFoot?'walk':'boat');
  setTouchSprint(false);
  document.getElementById('walkHud').hidden=!onFoot;document.getElementById('boatHud').hidden=onFoot;
  document.getElementById('journal').hidden=!onFoot;fitHarbor();
  document.getElementById('findBoat').hidden=!onFoot;
  document.getElementById('shift').hidden=true;
  document.getElementById('manifest').hidden=G.phase==='cruise';
  document.getElementById('voyageTitle').textContent=G.phase==='cruise'?'蓝顶艇　/　自由航行':'蓝顶艇　/　海运班次';
  if(onFoot)foot.sync();else shoreButton();
}
function boardBoat(){
  onFoot=false;keys.clear();G.phase='cruise';G.target=null;G.cargo=false;
  nodes.job.textContent='沿海探索 · 六处泊位可上岸';
  setStatus('已掌舵 · 方向键或点水面开船，Shift 加速，空格减速滑停');
  sound('start');travelHud();canvas.focus();
}
function moorRental(dock=DOCKS[courier.market]){
  harbor.moorAt(dock);
  Object.assign(G.boat,{a:dock.a,w:dock.w,va:0,vw:0,heading:dock.heading});
  G.hands=courier.fresh();
}
function nearbyDock(){
  if(G.phase==='over')return DOCKS[courier.market];
  if(G.service||G.transit)return null;
  return DOCKS.find(d=>dockDistance(d)<1.95);
}
function shoreButton(){
  const btn=document.getElementById('act'),dock=nearbyDock();btn.hidden=!dock;
  document.getElementById('shift').hidden=!(G.phase==='cruise'&&dock===DOCKS[courier.market]);
  let label=(dock?.name||'')+'上岸 · E';
  if(G.phase==='running')label='结束本班并上岸 · E';
  if(G.phase==='over')label='回鱼市上岸 · E';
  if(btn.textContent!==label&&btn.textContent!==window.harborTranslate?.(label))btn.textContent=label;
}
function useAction(){
  if(onFoot){foot.interact();return;}
  const dock=nearbyDock();if(!dock)return;
  const previousDock=harbor.rentalDock;
  resetGame();onFoot=true;moorRental(dock);
  if(dock!==previousDock)foot.prepare(previousDock);
  foot.ashore(...dock.landing);travelHud();canvas.focus();
}
function startGame(){if(G.phase!=='ready')return;G.phase='running';setStatus('靠近黄色泊位，接鱼市的鱼箱');sound('start');}
function restartShift(){
  resetGame();
  const dock=DOCKS[courier.market];
  Object.assign(G.boat,{a:dock.a,w:dock.w,heading:dock.heading});
  startGame();travelHud();
}
function finish(win){G.phase='over';G.target=null;setStatus((win?'五单送达，收工！':'时间到，完成 '+G.score+' 单')+' · 点水面再开一班');sound(win?'win':'bump');}
function dockDistance(d){return Math.hypot(G.boat.a-d.a,G.boat.w-d.w);}
function bump(nx,nw){
  if(G.bump>0)return;G.boat.va*=-.65;G.boat.vw*=-.65;G.boat.a=nx;G.boat.w=nw;G.bump=.55;
  if(G.phase==='cruise')setStatus('船舷擦碰 · 调整航向');else{G.time=Math.max(0,G.time-2);setStatus('碰撞 · 扣 2 秒');}sound('bump');
}
function beginService(dock){
  const boat=G.boat;
  G.service={dock,loading:!G.cargo,elapsed:0,a:boat.a,w:boat.w,heading:boat.heading};
  G.target=null;boat.va=0;boat.vw=0;
  setStatus(G.cargo?'已系缆 · 岸上接货':'已系缆 · 装鱼上船');
}
function dockService(dt){
  const job=G.service, dock=DOCKS[job.dock], hand=G.hands[job.dock];
  job.elapsed+=dt;
  if(hand.activity!=='wait')job.elapsed=Math.min(job.elapsed,courier.settle-.001);
  const t=ease(Math.min(1,job.elapsed/courier.settle));
  G.boat.a=lerp(job.a,dock.a,t);G.boat.w=lerp(job.w,dock.w,t);
  const angle=dock.heading-job.heading;
  G.boat.heading=job.heading+t*Math.atan2(Math.sin(angle),Math.cos(angle));
  if(job.elapsed<courier.duration)return;
  G.service=null;hand.activity='back';hand.stock=1;
  if(job.loading){
    G.cargo=true;courier.dispatch(G.hands[G.drop],'receive');sound('pickup');
    nodes.job.textContent='载鱼 · 送往'+DOCKS[G.drop].name;
    setStatus(G.score===0?'鱼箱已上船 · 绕过红灯塔，去咖啡店':'鱼箱已上船 · 驶向蓝色泊位');
  }else{
    G.cargo=false;nodes.score.textContent=++G.score;
    G.time=Math.min(60,G.time+4);nodes.time.textContent=Math.ceil(G.time);sound('deliver');
    if(G.score===5){oddities.record('fish');finish(true);return;}
    chooseJob();setStatus('已签收 · 奖励 4 秒');
  }
}
function update(dt){
  if(document.querySelector('dialog[open]'))return;
  G.clock+=dt;G.bump=Math.max(0,G.bump-dt);
  oldTown.advanceTraffic(dt);
  oldTown.recoverPedestrians(G.clock);
  courier.moveHands(G.hands,dt);
  if(onFoot)foot.update(dt);
  streetExhaust.update(dt);
  if(onFoot)return;
  shoreButton();
  const cruising=G.phase==='cruise';
  if(!cruising&&G.phase!=='running')return;
  if(G.transit){
    const port=G.transit.gate==='west'?'南航道':'西湾';
    shipping.transitStep(G,dt);
    if(!G.transit){
      if(G.cargo)oddities.record('detour');
      setStatus('已从'+port+'驶回港内'+(cruising?'':' · 继续前往'+DOCKS[G.cargo?G.drop:G.pickup].name));
    }
    return;
  }
  if(G.service){dockService(dt);return;}
  if(!cruising){
    G.time=Math.max(0,G.time-dt);nodes.time.textContent=Math.ceil(G.time);
    if(G.time<=0){finish(false);return;}
  }
  let da=0,dw=0;
  if(keys.has('ArrowLeft')||keys.has('a'))da--;
  if(keys.has('ArrowRight')||keys.has('d'))da++;
  if(keys.has('ArrowUp')||keys.has('w'))dw--;
  if(keys.has('ArrowDown')||keys.has('s'))dw++;
  const braking=brakingAt(Math.hypot(G.boat.va,G.boat.vw));
  if(braking){G.target=null;da=0;dw=0;}
  if(G.target&&!da&&!dw){
    const ta=G.target.a-G.boat.a,tw=G.target.w-G.boat.w,dist=Math.hypot(ta,tw);
    const brake=Math.exp(-3.5*dt);
    if(dist<2){G.boat.va*=brake;G.boat.vw*=brake;}
    if(dist>.15){da=ta/Math.max(1,dist);dw=tw/Math.max(1,dist);}
    else {G.target=null;G.boat.va=0;G.boat.vw=0;}
  }
  const throttle=boostHeld()?1.6:1,thrust=8.2*throttle;
  const topSpeed=Math.max(4.4*throttle,Math.hypot(G.boat.va,G.boat.vw)-8*dt);
  const mag=Math.max(1,Math.hypot(da,dw));G.boat.va+=da/mag*thrust*dt;G.boat.vw+=dw/mag*thrust*dt;
  const drifting=!da&&!dw&&!G.target;
  const drag=Math.pow(drifting ? .40 : .18,dt);G.boat.va*=drag;G.boat.vw*=drag;
  const dock=G.cargo?G.drop:G.pickup;
  const speed=Math.hypot(G.boat.va,G.boat.vw);
  let cap=cruising?topSpeed:lerp(1.1,topSpeed,clamp((dockDistance(DOCKS[dock])-.9)/1.5,0,1));
  if(braking)cap=Math.min(cap,Math.max(0,speed-3.8*dt));
  if(speed>cap){G.boat.va*=cap/speed;G.boat.vw*=cap/speed;}
  if(speed>.18)G.boat.heading=Math.atan2(G.boat.vw,G.boat.va);
  const oldA=G.boat.a,oldW=G.boat.w;G.boat.a+=G.boat.va*dt;G.boat.w+=G.boat.vw*dt;
  const [x,y]=world(G.boat.a,G.boat.w);
  const gate=shipping.boatGate(x,y);
  if((gate==='south'&&G.boat.vw>G.boat.va)||(gate==='west'&&G.boat.va+G.boat.vw<0)){
    shipping.enter(G,x,y,gate);setStatus('驶入外海航线 · 将从'+(gate==='west'?'南航道':'西湾')+'返回');return;
  }
  const coaster=shipping.vessel(STILL?0:G.clock);
  if(!harbor.navigable(x,y)||(coaster&&harbor.hullClearance(x,y,coaster)<.57)) {
    G.boat.a=oldA;
    G.boat.w=oldW;
    G.target=null;
    bump(oldA,oldW);
  }
  if(!cruising&&dockDistance(DOCKS[dock])<.88)beginService(dock);
}

function boatPin(){
  const p=project(...world(G.boat.a,G.boat.w,1.30));
  return {x:Math.round(p.sx),y:Math.round(p.sy)-9};
}
function drawBoatPin(){
  if(!onFoot||harborTruck.state.driving||G.transit)return;
  const {x,y}=boatPin();
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#174653';ctx.fillRect(-6,-6,13,12);
  ctx.fillRect(-4,6,9,1);ctx.fillRect(-2,7,5,1);ctx.fillRect(0,8,1,1);
  ctx.fillStyle='#a0e5e4';
  ctx.fillRect(-1,-4,3,2);ctx.fillRect(0,-2,1,6);ctx.fillRect(-2,0,5,1);
  ctx.fillRect(-4,1,1,2);ctx.fillRect(4,1,1,2);ctx.fillRect(-3,3,7,1);ctx.fillRect(-1,4,3,1);ctx.restore();
}

function drawMarker(d,color){
  const distance=dockDistance(d), strength=ease(clamp((distance-1.05)/4.4,0,1));
  if(strength<=.01)return;
  const berth=project(...world(d.a,d.w,.08)), radius=2+3*strength;
  const bob=STILL?0:Math.sin(G.clock*4)*strength;
  function dot(x,y,ink){
    const i=Math.round(y)*W+Math.round(x),base=pix[i];
    const channel=n=>lerp((base>>>n)&255,(ink>>>n)&255,strength);
    pix[i]=rgb(channel(0),channel(8),channel(16));
  }
  function stamp(dy,ink){
    for(let k=0;k<24;k++){
      const a=k*Math.PI/12;
      dot(berth.sx+radius*Math.cos(a),berth.sy+radius*.50*Math.sin(a)+dy,ink);
    }
    for(let row=0;row<4;row++)for(let x=-row;x<=row;x++)
      dot(berth.sx+x,berth.sy-4-bob-row+dy,ink);
  }
  stamp(1,MARKER_SHADOW);
  stamp(0,color);
}
function draw(){
  if(interiors.active){interiors.draw();positionCamera();return;}
  pix.set(bakedPix);zb.set(bakedZ);shadowMask.fill(0);pendingShadows.length=0;
  oldTown.animate(G.clock);
  const windT=STILL?0:Math.floor(G.clock*WIND_FPS)/WIND_FPS;drawLeaves(windT);drawTufts(windT);flushShadows();applyShadows(bakedZ);shadeEdges();
  harborSea.draw(STILL?0:G.clock);
  harborCutaway.animate(STILL?0:G.clock);
  courier.drawScene(G);
  if(onFoot)foot.drawPeople();
  harborSky.shade(G.clock);
  harborSky.drawBirds(G.clock);
  harborEvents.swing(G.clock);
  harborSky.drawClouds(G.clock);
  if(!onFoot&&!G.service&&G.phase==='running')drawMarker(DOCKS[G.cargo?G.drop:G.pickup],G.cargo?DELIVERY:HC_SIGNAL);
  ctx.putImageData(image,0,0);harborTruck.drawMarker();drawBoatPin();if(onFoot)foot.labels(G.clock);positionCamera();
}
function pointerPosition(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function setTarget(e){
  if(!keys.has('brake'))slowingToStop=false;
  if(onFoot){ensureAudio();canvas.focus({preventScroll:true});foot.tap(pointerPosition(e));return;}
  ensureAudio();canvas.focus({preventScroll:true});
  if(G.phase==='over'){restartShift();return;}
  if(G.service||G.transit)return;startGame();
  const p=pointerPosition(e), active=DOCKS[G.cargo?G.drop:G.pickup];
  const beacon=project(...world(active.a,active.w,.08));
  if(G.phase!=='cruise'&&Math.hypot(p.x-beacon.sx,p.y-beacon.sy+3)<6){
    const n=Math.ceil(dockDistance(active)/.25);
    for(let i=1;i<=n;i++){
      const t=i/n,[x,y]=world(lerp(G.boat.a,active.a,t),lerp(G.boat.w,active.w,t));
      if(!harbor.navigable(x,y)){
        G.target=null;setStatus('前方有障碍 · 点开阔水面分段航行，再靠泊');return;
      }
    }
    G.target={a:active.a,w:active.w};return;
  }
  const a=(p.x-OX)/S,w=(p.y-OY)/(S*SIN),[x,y]=world(a,w);
  const gate=shipping.boatGate(x,y,2);
  if(gate){
    const tx=gate==='west'?shipping.westEdge(y)-1:x,ty=gate==='south'?shipping.exitY+1:y;
    G.target={a:(tx-ty)/R2,w:(tx+ty)/R2};
  }else if(harbor.navigable(x,y))G.target={a,w};
}
canvas.addEventListener('pointerdown',setTarget);
addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'&&e.target.closest?.('button,a[href]'))return;
  const k=e.key.toLowerCase();
  if(k==='shift'){keys.add('shift');return;}
  if(e.code==='Space'){
    e.preventDefault();
    if(!onFoot||harborTruck.state.driving){keys.add('brake');slowingToStop=true;}
    else if(!interiors.active&&!e.repeat)foot.jump();
    return;
  }
  if(k==='e'&&!e.repeat){e.preventDefault();useAction();return;}
  if(onFoot&&k==='j'&&!e.repeat){foot.journal();return;}
  const key=e.key.length===1?k:e.key;
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d'].includes(key))return;
  if(!e.repeat&&!keys.has('brake'))slowingToStop=false;
  e.preventDefault();ensureAudio();
  if(!onFoot){if(G.phase==='over')restartShift();startGame();G.target=null;}
  keys.add(key);
});
addEventListener('keyup',e=>{
  if(e.code==='Space'){foot.releaseJump();keys.delete('brake');}
  keys.delete(e.key==='Shift'?'shift':e.key.length===1?e.key.toLowerCase():e.key);
});
addEventListener('blur',()=>{keys.clear();foot.releaseJump();setTouchSprint(false);});

let audio=null,soundBus=null,muted=false;
function ensureAudio(){
  if(!audio){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audio=new AC();soundBus=audio.createGain();soundBus.connect(audio.destination);
  }
  if(audio.state==='suspended')audio.resume();
}
addEventListener('pointerdown',ensureAudio,{once:true,capture:true});
addEventListener('keydown',ensureAudio,{once:true,capture:true});
const streetClips=new Map(),lastSoundVariant=new Map();
function nextSoundVariant(kind){
  const last=lastSoundVariant.get(kind);
  const variant=last===undefined?Math.floor(Math.random()*4):(last+1+Math.floor(Math.random()*3))%4;
  lastSoundVariant.set(kind,variant);return variant;
}
function streetClip(kind,variant){
  const key=kind+variant;
  if(streetClips.has(key))return streetClips.get(key);
  const horn=kind==='horn',rate=audio.sampleRate;
  const hold=[.105,.15,.19,.235][variant],delay=[.031,.043,.054,.067][variant];

<script>
// Keep simulation state and saves language-independent. Localize at the DOM boundary,
// including newly opened ledgers, task feedback and accessible control labels.
(()=>{
  const button=document.getElementById('languageToggle'), stage=document.getElementById('stage');
  const storeKey='pixel-plays.harbor.language', savedText=new WeakMap();
  const attrs=['aria-label','title'];
  const phrases=Object.keys(harborEnglish).sort((a,b)=>b.length-a.length);
  const pattern=new RegExp(phrases.map(key=>key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let lang='zh-CN';
  try{lang=localStorage.getItem(storeKey)==='en'?'en':'zh-CN'}catch{}
  function translate(original){
    if(lang!=='en')return original;
    return original.replace(pattern,k=>harborEnglish[k]);
  }
  window.harborTranslate=translate;
  function localize(node,key,current,write){
    if(!current)return;
    let records=savedText.get(node);
    if(!records){records=new Map();savedText.set(node,records)}
    const last=records.get(key);
    const original=last&&last.shown===current?last.original:current;
    const shown=translate(original);
    records.set(key,{original,shown});if(shown!==current)write(shown);
  }
  function scan(node){
    if(node.nodeType===Node.TEXT_NODE){
      if(node.parentElement?.closest('[translate="no"]'))return;
      localize(node,'text',node.data,v=>{node.data=v});return;
    }
    if(node.nodeType!==Node.ELEMENT_NODE||node.closest('[translate="no"]'))return;
    for(const key of attrs)localize(node,key,node.getAttribute(key),v=>node.setAttribute(key,v));
    node.childNodes.forEach(scan);
  }
  function refresh(){
    document.documentElement.lang=lang;
    document.title=lang==='en'?'Harbor Courier · Town Errands':'港湾快递 · 小镇委托';
    button.textContent=lang==='en'?'中文':'EN';
    button.lang=lang==='en'?'zh-CN':'en';
    button.setAttribute('aria-label',lang==='en'?'切换到中文':'Switch to English');
    scan(stage);if(typeof positionCamera==='function')positionCamera();
  }
  button.addEventListener('click',()=>{
    lang=lang==='en'?'zh-CN':'en';try{localStorage.setItem(storeKey,lang)}catch{}
    refresh();canvas.focus({preventScroll:true});
  });
  refresh();
  new MutationObserver(changes=>{
    if(lang!=='en')return;
    for(const m of changes){
      if(m.type==='childList'){m.addedNodes.forEach(scan);continue}
      scan(m.target);
    }
  }).observe(stage,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();

</script>
